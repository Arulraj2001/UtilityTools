  <!-- Key (Security aspect) -->
  <circle cx="44" cy="64" r="14" fill="none" stroke="#047857" stroke-width="6.5"/>
  <line x1="58" y1="64" x2="94" y2="64" stroke="#047857" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="78" y1="64" x2="78" y2="76" stroke="#047857" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="88" y1="64" x2="88" y2="76" stroke="#047857" stroke-width="6.5" stroke-linecap="round"/>
