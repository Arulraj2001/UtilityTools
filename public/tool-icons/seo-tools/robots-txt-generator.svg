  <circle cx="64" cy="22" r="5" fill="#059669"/>
  <!-- Ears -->
  <rect x="28" y="54" width="6" height="20" rx="2" fill="#059669"/>
  <rect x="94" y="54" width="6" height="20" rx="2" fill="#059669"/>
</svg>
