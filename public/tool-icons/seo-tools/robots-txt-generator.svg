<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Robots.txt Generator</title>
  <rect width="128" height="128" rx="28" fill="#f0fdf4"/>
  <!-- Robot head -->
  <rect x="34" y="38" width="60" height="52" rx="12" fill="#a7f3d0" stroke="#059669" stroke-width="6"/>
  <!-- Eyes -->
  <circle cx="52" cy="60" r="6" fill="#047857"/>
  <circle cx="76" cy="60" r="6" fill="#047857"/>
  <!-- Antenna -->
