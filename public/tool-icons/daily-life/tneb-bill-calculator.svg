  <!-- Prongs -->
  <line x1="54" y1="66" x2="54" y2="52" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <line x1="74" y1="66" x2="74" y2="52" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <!-- Cord -->
  <path d="M64 96 v14 c0 4-4 8-10 8" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
