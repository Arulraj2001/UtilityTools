<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">PF Calculator India</title>
  <rect width="128" height="128" rx="28" fill="#fff7ed"/>
  <!-- Piggy Bank Body -->
  <circle cx="64" cy="70" r="28" fill="#ffedd5" stroke="#ea580c" stroke-width="6"/>
  <!-- Ears -->
  <path d="M50 46 L38 32 L56 38 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="5" stroke-linejoin="round"/>
  <!-- Feet -->
  <rect x="46" y="94" width="10" height="10" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <rect x="72" y="94" width="10" height="10" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <!-- Snout -->
  <rect x="90" y="64" width="10" height="12" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <!-- Eye -->
  <circle cx="78" cy="62" r="2.5" fill="#c2410c"/>
  <!-- Slot -->
  <line x1="56" y1="42" x2="72" y2="42" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <!-- Rupee Coin falling in slot -->
  <circle cx="64" cy="24" r="10" fill="#ffedd5" stroke="#c2410c" stroke-width="4"/>
  <path d="M60 21 h8 M60 25 h8 M62 21 v5 C 62 28 65 28 65 28" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
</svg>
