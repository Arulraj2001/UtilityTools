<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Roman Numerals Converter</title>
  <rect width="128" height="128" rx="28" fill="#fff7ed"/>
  <!-- Classical Roman Column (Background element) -->
  <rect x="42" y="24" width="44" height="10" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <rect x="38" y="90" width="52" height="10" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <rect x="34" y="100" width="60" height="8" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <!-- Column Shaft Fluting -->
  <line x1="48" y1="34" x2="48" y2="90" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="34" x2="64" y2="90" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="34" x2="80" y2="90" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <!-- Roman Numerals "V" and "X" (Foreground) -->
  <g opacity="0.95">
    <!-- Roman V -->
    <path d="M38 52 l12 20 l12 -20" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Roman X -->
    <path d="M72 52 l20 20 M92 52 l-20 20" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
