<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Flipkart Fee Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Flipkart-like Shopping Bag -->
  <!-- Handles -->
  <path d="M48 46 C48 30, 80 30, 80 46" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <!-- Bag Body -->
  <path d="M34 46 H94 L100 92 H28 Z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="6" stroke-linejoin="round"/>
  <!-- Yellow Flipkart branding swoosh -->
  <path d="M44 68 C 54 78, 70 78, 80 68" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round"/>
  <!-- Payout Rupee Coin -->
  <circle cx="86" cy="84" r="18" fill="#f0f9ff" stroke="#0369a1" stroke-width="4.5"/>
  <path d="M80 79 h12 M80 84 h12 M83 79 v9 c0 2 3 3 5 3 M84 92 l 6 6" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
