<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Inventory Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Stacked Boxes (Inventory) -->
  <!-- Top Box -->
  <rect x="50" y="30" width="28" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="5"/>
  <path d="M50 42 H78 M64 30 V54" fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <!-- Bottom Left Box -->
  <rect x="32" y="58" width="28" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="5"/>
  <path d="M32 70 H60 M46 58 V82" fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <!-- Bottom Right Box -->
  <rect x="66" y="58" width="28" height="24" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="5"/>
  <path d="M66 70 H94 M80 58 V82" fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <!-- Verification Checklist Badge -->
  <circle cx="86" cy="84" r="18" fill="#f0f9ff" stroke="#0369a1" stroke-width="4.5"/>
  <path d="M78 84 l5 5 l10-10" fill="none" stroke="#0369a1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
