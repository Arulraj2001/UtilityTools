<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Shipping Label Generator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Shipping Label Document -->
  <rect x="36" y="24" width="56" height="80" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="6"/>
  <!-- Top Banner -->
  <rect x="42" y="30" width="44" height="12" fill="#e0f2fe"/>
  <line x1="48" y1="36" x2="80" y2="36" stroke="#0369a1" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Address Lines -->
  <line x1="46" y1="52" x2="82" y2="52" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="60" x2="72" y2="60" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="68" x2="80" y2="68" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Barcode (varying thickness lines) -->
  <g transform="translate(44, 76)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#0369a1" stroke-width="3"/>
    <line x1="6" y1="0" x2="6" y2="16" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="11" y1="0" x2="11" y2="16" stroke="#0369a1" stroke-width="4.5"/>
    <line x1="17" y1="0" x2="17" y2="16" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="22" y1="0" x2="22" y2="16" stroke="#0369a1" stroke-width="3"/>
    <line x1="28" y1="0" x2="28" y2="16" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="33" y1="0" x2="33" y2="16" stroke="#0369a1" stroke-width="4.5"/>
    <line x1="39" y1="0" x2="39" y2="16" stroke="#0369a1" stroke-width="2"/>
  </g>
</svg>
