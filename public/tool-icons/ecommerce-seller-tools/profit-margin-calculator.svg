<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Profit Margin Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Exploded Pie Chart -->
  <!-- Cost portion (base circle) -->
  <path d="M60 68 L60 28 A40 40 0 1 0 100 68 Z" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="6" stroke-linejoin="round"/>
  <!-- Profit segment (exploded) -->
  <path d="M68 60 L68 20 A40 40 0 0 1 108 60 Z" fill="#f0f9ff" stroke="#0369a1" stroke-width="6" stroke-linejoin="round"/>
  <!-- Percentage indicator inside the exploded slice -->
  <text x="88" y="44" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#0369a1" text-anchor="middle">%</text>
</svg>
