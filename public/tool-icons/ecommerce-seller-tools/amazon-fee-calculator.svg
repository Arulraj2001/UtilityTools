<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Amazon Fee Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- 3D Shipping Box -->
  <!-- Top Face -->
  <polygon points="64,26 96,38 64,50 32,38" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="6" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="32,38 64,50 64,88 32,76" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="6" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="64,50 96,38 96,76 64,88" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="6" stroke-linejoin="round"/>
  <!-- Amazon Smile Arrow -->
  <path d="M42 96 C 54 104, 74 104, 86 96" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 98 l6-2 l-2-6" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Percentage Badge -->
  <circle cx="92" cy="84" r="16" fill="#f0f9ff" stroke="#0369a1" stroke-width="4.5"/>
  <text x="92" y="89" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#0369a1" text-anchor="middle">%</text>
</svg>
