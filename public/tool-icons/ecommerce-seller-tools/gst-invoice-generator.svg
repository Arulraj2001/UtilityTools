<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">GST Invoice Generator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Invoice Sheet -->
  <rect x="36" y="24" width="56" height="80" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="6"/>
  <!-- Invoice Title line -->
  <line x1="46" y1="36" x2="82" y2="36" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Row Grid representation -->
  <rect x="44" y="46" width="40" height="32" fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="44" y1="56" x2="84" y2="56" stroke="#0ea5e9" stroke-width="2.5"/>
  <line x1="44" y1="66" x2="84" y2="66" stroke="#0ea5e9" stroke-width="2.5"/>
  <line x1="68" y1="46" x2="68" y2="78" stroke="#0ea5e9" stroke-width="2.5"/>
  <!-- GST Badge overlay (Bottom Right) -->
  <circle cx="86" cy="84" r="18" fill="#f0f9ff" stroke="#ea580c" stroke-width="4.5"/>
  <text x="86" y="88" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#ea580c" text-anchor="middle">GST</text>
</svg>
