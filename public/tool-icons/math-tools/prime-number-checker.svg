<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Prime Number Checker</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Prime Numbers display -->
  <text x="44" y="66" font-family="system-ui, sans-serif" font-weight="bold" font-size="34" fill="#0ea5e9" text-anchor="middle">7</text>
  <text x="82" y="66" font-family="system-ui, sans-serif" font-weight="bold" font-size="34" fill="#0ea5e9" text-anchor="middle">11</text>
  <!-- Verification Check Badge (Bottom Right) -->
  <circle cx="86" cy="84" r="18" fill="#f0f9ff" stroke="#0369a1" stroke-width="4.5"/>
  <path d="M78 84 l5 5 l10-10" fill="none" stroke="#0369a1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
