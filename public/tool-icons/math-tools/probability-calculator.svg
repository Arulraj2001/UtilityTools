<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Probability Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Die 1 (Straight, Showing 5) -->
  <rect x="30" y="34" width="40" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="6"/>
  <circle cx="40" cy="44" r="3" fill="#0ea5e9"/>
  <circle cx="60" cy="44" r="3" fill="#0ea5e9"/>
  <circle cx="50" cy="54" r="3" fill="#0ea5e9"/>
  <circle cx="40" cy="64" r="3" fill="#0ea5e9"/>
  <circle cx="60" cy="64" r="3" fill="#0ea5e9"/>
  <!-- Die 2 (Rotated, Showing 3) -->
  <g transform="translate(62, 54) rotate(20 20 20)">
    <rect width="40" height="40" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="5.5"/>
    <circle cx="10" cy="10" r="3" fill="#0369a1"/>
    <circle cx="20" cy="20" r="3" fill="#0369a1"/>
    <circle cx="30" cy="30" r="3" fill="#0369a1"/>
  </g>
</svg>
