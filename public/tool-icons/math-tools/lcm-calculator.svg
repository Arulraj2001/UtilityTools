<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">LCM Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Overlapping circles representing set intersections/LCM -->
  <circle cx="50" cy="64" r="26" fill="#e0f2fe" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="5"/>
  <circle cx="78" cy="64" r="26" fill="#e0f2fe" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="5"/>
  <!-- Common Multiple Highlight Badge -->
  <circle cx="64" cy="64" r="16" fill="#f0f9ff" stroke="#0369a1" stroke-width="4"/>
  <text x="64" y="68" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" fill="#0369a1" text-anchor="middle">LCM</text>
</svg>
