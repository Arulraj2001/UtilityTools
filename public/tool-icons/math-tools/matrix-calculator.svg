<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Matrix Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Matrix Brackets -->
  <path d="M42 32 H32 V96 H42" fill="none" stroke="#0ea5e9" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 32 H96 V96 H86" fill="none" stroke="#0ea5e9" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Matrix Elements (a, b, c, d) -->
  <text x="46" y="56" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0369a1" text-anchor="middle">a</text>
  <text x="82" y="56" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0369a1" text-anchor="middle">b</text>
  <text x="46" y="84" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0369a1" text-anchor="middle">c</text>
  <text x="82" y="84" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#0369a1" text-anchor="middle">d</text>
</svg>
