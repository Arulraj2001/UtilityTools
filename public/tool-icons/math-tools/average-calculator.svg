<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Average Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0f9ff"/>
  <!-- Chart Axes -->
  <path d="M28 92 H96 M28 92 V36" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data Bars of different heights -->
  <rect x="38" y="68" width="12" height="24" rx="2.5" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4.5"/>
  <rect x="56" y="44" width="12" height="48" rx="2.5" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4.5"/>
  <rect x="74" y="58" width="12" height="34" rx="2.5" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4.5"/>
  <!-- Horizontal Average Line -->
  <line x1="32" y1="56" x2="94" y2="56" stroke="#ea580c" stroke-width="4.5" stroke-dasharray="5 5" stroke-linecap="round"/>
</svg>
