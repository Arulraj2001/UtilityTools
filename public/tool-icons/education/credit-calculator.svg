<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Credit Calculator</title>
  <rect width="128" height="128" rx="28" fill="#ecfdf5"/>
  <!-- Blocks stacking up representing credits -->
  <rect x="28" y="74" width="72" height="22" rx="6" fill="#a7f3d0" stroke="#059669" stroke-width="5"/>
  <rect x="38" y="52" width="52" height="22" rx="6" fill="#a7f3d0" stroke="#059669" stroke-width="5"/>
  <rect x="48" y="30" width="32" height="22" rx="6" fill="#a7f3d0" stroke="#059669" stroke-width="5"/>
  <!-- Check marks or numeric indicator -->
  <path d="M60 41 l2 2 l4-4" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 63 l2 2 l4-4" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
