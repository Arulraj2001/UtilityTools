<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Exam Score Calculator</title>
  <rect width="128" height="128" rx="28" fill="#eff6ff"/>
  <!-- Dial gauge -->
  <path d="M30 84 A40 40 0 0 1 98 84" fill="none" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round"/>
  <!-- Colored segments of the gauge -->
  <path d="M30 84 A40 40 0 0 1 54 48" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <path d="M54 48 A40 40 0 0 1 74 48" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
  <path d="M74 48 A40 40 0 0 1 98 84" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
  <!-- Pointer needle -->
  <line x1="64" y1="84" x2="80" y2="52" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="84" r="8" fill="#1e3a8a"/>
</svg>
