<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Age Calculator</title>
  <rect width="128" height="128" rx="28" fill="#fff5f5"/>
  <!-- Calendar Grid -->
  <rect x="28" y="32" width="72" height="68" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="6"/>
  <line x1="28" y1="52" x2="100" y2="52" stroke="#ef4444" stroke-width="6"/>
  <line x1="48" y1="24" x2="48" y2="38" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="24" x2="80" y2="38" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/>
  <!-- Birthday Cake in center of calendar -->
  <rect x="46" y="68" width="36" height="20" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="4"/>
  <!-- Candle -->
  <line x1="64" y1="60" x2="64" y2="68" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 54c1 2-1 4-1 6h2s-2-4-1-6z" fill="#f59e0b"/>
</svg>
