<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Cutoff Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0fdf4"/>
  <!-- Bar chart bars -->
  <rect x="32" y="66" width="14" height="28" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="4"/>
  <rect x="52" y="44" width="14" height="50" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="4"/>
  <rect x="72" y="32" width="14" height="62" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="4"/>
  <!-- Cutoff line (horizontal dashed red line) -->
  <line x1="24" y1="52" x2="98" y2="52" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <!-- Flag marking target -->
  <path d="M96 28 h12 v12 h-12 Z" fill="#ca8a04"/>
  <line x1="96" y1="28" x2="96" y2="52" stroke="#ca8a04" stroke-width="4"/>
</svg>
