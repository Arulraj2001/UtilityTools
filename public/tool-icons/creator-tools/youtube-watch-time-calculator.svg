<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">YouTube Watch Time Calculator</title>
  <rect width="128" height="128" rx="28" fill="#fef2f2"/>
  <!-- Play Button Container -->
  <rect x="32" y="34" width="64" height="48" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="6"/>
  <polygon points="58,48 58,68 76,58" fill="#dc2626" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
  <!-- Stopwatch / Clock Overlay -->
  <circle cx="86" cy="82" r="20" fill="#fef2f2" stroke="#991b1b" stroke-width="5"/>
  <!-- Stopwatch Top Knobs -->
  <path d="M83 58 h6 V62 H83 Z" fill="#991b1b"/>
  <path d="M96 64 l4-4" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock Hands -->
  <path d="M86 70 V82 H94" fill="none" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
