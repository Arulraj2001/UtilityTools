<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">YouTube Thumbnail Size Checker</title>
  <rect width="128" height="128" rx="28" fill="#fef2f2"/>
  <!-- Image Frame (16:9) -->
  <rect x="24" y="34" width="80" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="6"/>
  <!-- Landscape Icon Details -->
  <circle cx="42" cy="48" r="6" fill="#dc2626"/>
  <polygon points="32,74 50,56 62,68 76,52 96,74" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round"/>
  <!-- 16:9 Dimension Badge -->
  <rect x="66" y="66" width="46" height="24" rx="12" fill="#fef2f2" stroke="#991b1b" stroke-width="4.5"/>
  <text x="89" y="82" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#991b1b" text-anchor="middle">16:9</text>
</svg>
