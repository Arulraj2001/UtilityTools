<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Instagram Engagement Calculator</title>
  <rect width="128" height="128" rx="28" fill="#fef2f2"/>
  <!-- Camera Shape (Instagram reference) -->
  <rect x="32" y="38" width="60" height="60" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="6"/>
  <circle cx="62" cy="68" r="14" fill="none" stroke="#dc2626" stroke-width="5"/>
  <circle cx="76" cy="54" r="3.5" fill="#dc2626"/>
  <!-- Heart Icon (Engagement likes/interaction) -->
  <path d="M88 96 C88 96 100 90 100 82 C100 74 92 74 88 80 C84 74 76 74 76 82 C76 90 88 96 88 96 Z" fill="#fef2f2" stroke="#991b1b" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Percentage Badge (Analytical output) -->
  <circle cx="92" cy="38" r="15" fill="#fef2f2" stroke="#991b1b" stroke-width="4"/>
  <text x="92" y="43" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#991b1b" text-anchor="middle">%</text>
</svg>
