<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Hashtag Density Checker</title>
  <rect width="128" height="128" rx="28" fill="#fef2f2"/>
  <!-- Hashtag Symbol -->
  <!-- Slanted Vertical Lines -->
  <line x1="52" y1="28" x2="42" y2="92" stroke="#dc2626" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="74" y1="28" x2="64" y2="92" stroke="#dc2626" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Horizontal Lines -->
  <line x1="28" y1="46" x2="88" y2="46" stroke="#dc2626" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="22" y1="70" x2="82" y2="70" stroke="#dc2626" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Magnifying Glass -->
  <!-- Handle -->
  <line x1="93" y1="93" x2="108" y2="108" stroke="#991b1b" stroke-width="6" stroke-linecap="round"/>
  <!-- Lens Frame -->
  <circle cx="82" cy="82" r="16" fill="#fef2f2" stroke="#991b1b" stroke-width="5"/>
</svg>
