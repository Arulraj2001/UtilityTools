  <!-- Bar 1 -->
  <rect x="38" y="72" width="12" height="20" rx="2.5" fill="#fee2e2" stroke="#dc2626" stroke-width="4.5"/>
  <!-- Bar 2 -->
  <rect x="56" y="56" width="12" height="36" rx="2.5" fill="#fee2e2" stroke="#dc2626" stroke-width="4.5"/>
  <!-- Bar 3 -->
  <rect x="74" y="42" width="12" height="50" rx="2.5" fill="#fee2e2" stroke="#dc2626" stroke-width="4.5"/>
  <!-- Rising Trend Line -->
  <path d="M32 86 C 48 86, 68 62, 94 36" fill="none" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M84 36 h10 v10" fill="none" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
