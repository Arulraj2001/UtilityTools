<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Content Upload Scheduler</title>
  <rect width="128" height="128" rx="28" fill="#fef2f2"/>
  <!-- Calendar Page -->
  <rect x="34" y="32" width="60" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="6"/>
  <!-- Binder Rings -->
  <rect x="46" y="24" width="8" height="14" rx="3" fill="#fef2f2" stroke="#991b1b" stroke-width="3"/>
  <rect x="74" y="24" width="8" height="14" rx="3" fill="#fef2f2" stroke="#991b1b" stroke-width="3"/>
  <!-- Grid Lines -->
  <line x1="34" y1="52" x2="94" y2="52" stroke="#dc2626" stroke-width="4"/>
  <line x1="54" y1="52" x2="54" y2="98" stroke="#dc2626" stroke-width="3"/>
  <line x1="74" y1="52" x2="74" y2="98" stroke="#dc2626" stroke-width="3"/>
  <!-- Checkmark on Calendar -->
  <path d="M42 66 l4 4 l8 -8" fill="none" stroke="#991b1b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock Overlay (Bottom Right) -->
  <circle cx="86" cy="84" r="18" fill="#fef2f2" stroke="#991b1b" stroke-width="4.5"/>
  <path d="M86 74 V84 H92" fill="none" stroke="#991b1b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
