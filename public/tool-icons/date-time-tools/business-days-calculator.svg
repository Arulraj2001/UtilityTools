<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Business Days Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Calendar Page (Background) -->
  <rect x="30" y="30" width="56" height="62" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="5.5"/>
  <line x1="30" y1="48" x2="86" y2="48" stroke="#0d9488" stroke-width="3.5"/>
  <!-- Mini binder rings -->
  <line x1="42" y1="24" x2="42" y2="34" stroke="#115e59" stroke-width="4" stroke-linecap="round"/>
  <line x1="74" y1="24" x2="74" y2="34" stroke="#115e59" stroke-width="4" stroke-linecap="round"/>
  <!-- Briefcase (Work aspect, Foreground) -->
  <rect x="64" y="62" width="40" height="28" rx="4" fill="#f0fdfa" stroke="#115e59" stroke-width="5"/>
  <path d="M76 62 V54 H92 V62" fill="none" stroke="#115e59" stroke-width="4" stroke-linejoin="round"/>
  <rect x="80" y="72" width="8" height="6" rx="1" fill="#ea580c"/>
</svg>
