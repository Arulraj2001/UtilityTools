<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Timezone Converter</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Clock 1 (Left, angled slightly) -->
  <circle cx="44" cy="54" r="20" fill="#ccfbf1" stroke="#0d9488" stroke-width="5"/>
  <path d="M44 44 V54 H54" fill="none" stroke="#115e59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock 2 (Right, lower down) -->
  <circle cx="84" cy="74" r="20" fill="#ccfbf1" stroke="#0d9488" stroke-width="5"/>
  <path d="M84 64 V74 H74" fill="none" stroke="#115e59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Conversion Arrows -->
  <path d="M54 38 C 64 30, 72 32, 78 38" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M72 38 h6 v-6" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 90 C 64 98, 56 96, 50 90" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M56 90 h-6 v6" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
