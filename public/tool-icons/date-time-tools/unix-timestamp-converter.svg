<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Unix Timestamp Converter</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  
  <!-- Terminal Screen (Background layer) -->
  <rect x="22" y="26" width="72" height="58" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="5"/>
  <line x1="22" y1="40" x2="94" y2="40" stroke="#0d9488" stroke-width="3"/>
  <!-- Window dots -->
  <circle cx="30" cy="33" r="2.5" fill="#115e59"/>
  <circle cx="38" cy="33" r="2.5" fill="#115e59"/>
  <circle cx="46" cy="33" r="2.5" fill="#115e59"/>
  <!-- Terminal text cursor -->
  <path d="M30 50 L34 54 L30 58" fill="none" stroke="#115e59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Unix numbers representation -->
  <line x1="40" y1="54" x2="76" y2="54" stroke="#115e59" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="64" y2="68" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>

  <!-- Calendar Page (Foreground layer, overlapping bottom-right) -->
  <rect x="62" y="54" width="44" height="48" rx="6" fill="#f0fdfa" stroke="#115e59" stroke-width="4"/>
  <!-- Binder Rings -->
  <rect x="70" y="47" width="6" height="12" rx="2" fill="#ccfbf1" stroke="#115e59" stroke-width="2"/>
  <rect x="90" y="47" width="6" height="12" rx="2" fill="#ccfbf1" stroke="#115e59" stroke-width="2"/>
  <!-- Calendar Header -->
  <path d="M64 56 H104 V68 H64 Z" fill="#0d9488"/>
  <!-- Calendar Grid Lines -->
  <line x1="68" y1="78" x2="100" y2="78" stroke="#115e59" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="88" x2="100" y2="88" stroke="#115e59" stroke-width="2" stroke-linecap="round"/>
  <!-- Highlighting date marker (orange/red accent) -->
  <circle cx="90" cy="88" r="3.5" fill="#ea580c"/>

  <!-- Dynamic Sync Arrow -->
  <path d="M50 78 C 50 88, 54 92, 58 92" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54 88 L58 92 L54 96" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
