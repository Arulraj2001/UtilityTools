<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Stopwatch</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Top Pushers & Rings -->
  <path d="M52 24 C52 14, 76 14, 76 24" fill="none" stroke="#0d9488" stroke-width="4.5"/>
  <rect x="58" y="20" width="12" height="10" rx="2" fill="#115e59" stroke="#0d9488" stroke-width="3"/>
  <!-- Side buttons -->
  <path d="M88 42 L94 36 M40 42 L34 36" fill="none" stroke="#0d9488" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Stopwatch Body -->
  <circle cx="64" cy="70" r="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="6.5"/>
  <!-- Inner ticks and hands -->
  <circle cx="64" cy="70" r="4" fill="#115e59"/>
  <line x1="64" y1="70" x2="80" y2="54" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Dial markers -->
  <line x1="64" y1="44" x2="64" y2="50" stroke="#0d9488" stroke-width="3"/>
  <line x1="64" y1="90" x2="64" y2="96" stroke="#0d9488" stroke-width="3"/>
  <line x1="38" y1="70" x2="44" y2="70" stroke="#0d9488" stroke-width="3"/>
  <line x1="84" y1="70" x2="90" y2="70" stroke="#0d9488" stroke-width="3"/>
</svg>
