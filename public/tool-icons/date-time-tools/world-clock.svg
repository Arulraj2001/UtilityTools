<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">World Clock</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Globe representation -->
  <circle cx="64" cy="64" r="32" fill="#ccfbf1" stroke="#0d9488" stroke-width="6"/>
  <!-- Longitude lines -->
  <ellipse cx="64" cy="64" rx="16" ry="32" fill="none" stroke="#0d9488" stroke-width="3.5"/>
  <line x1="64" y1="32" x2="64" y2="96" stroke="#0d9488" stroke-width="3.5"/>
  <!-- Latitude lines -->
  <line x1="36" y1="52" x2="92" y2="52" stroke="#0d9488" stroke-width="3.5"/>
  <line x1="36" y1="76" x2="92" y2="76" stroke="#0d9488" stroke-width="3.5"/>
  <!-- Clock hands overlay -->
  <circle cx="64" cy="64" r="4.5" fill="#115e59"/>
  <line x1="64" y1="64" x2="64" y2="44" stroke="#115e59" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="80" y2="64" stroke="#115e59" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="52" y2="78" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
</svg>
