<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Countdown Timer</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Hourglass Frame -->
  <path d="M40 32 H88 M40 96 H88" fill="none" stroke="#0d9488" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Glass Bulb Outer Curves -->
  <path d="M44 32 L56 64 L44 96 H84 L72 64 L84 32 Z" fill="#ccfbf1" stroke="#0d9488" stroke-width="6" stroke-linejoin="round"/>
  <!-- Top Sand -->
  <polygon points="52,40 76,40 64,60" fill="#115e59"/>
  <!-- Falling sand stream -->
  <line x1="64" y1="58" x2="64" y2="84" stroke="#115e59" stroke-width="3" stroke-dasharray="3 3"/>
  <!-- Bottom Sand Pile -->
  <path d="M50 96 C 50 86, 78 86, 78 96 Z" fill="#115e59"/>
</svg>
