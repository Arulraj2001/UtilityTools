<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Tip Calculator</title>
  <rect width="128" height="128" rx="28" fill="#fdf2f8"/>
  <!-- Cash Note -->
  <rect x="26" y="38" width="76" height="46" rx="8" fill="#fbcfe8" stroke="#db2777" stroke-width="6"/>
  <!-- Central Emblem on Note -->
  <circle cx="64" cy="61" r="11" fill="none" stroke="#be185d" stroke-width="4"/>
  <!-- Coin overlapping the Note -->
  <circle cx="86" cy="74" r="18" fill="#fde047" stroke="#d97706" stroke-width="4"/>
  <!-- Dollar Symbol inside the Coin -->
  <path d="M86 66v16M82 70h8a3 3 0 0 0 0-6h-8a3 3 0 0 0 0 6h8a3 3 0 0 1 0 6h-8" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
