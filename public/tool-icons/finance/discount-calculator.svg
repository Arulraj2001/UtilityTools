<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Discount Calculator</title>
  <rect width="128" height="128" rx="28" fill="#fef3c7"/>
  <!-- Tilted Discount Tag -->
  <path d="M42 32h34l26 26l-34 34l-26-26z" fill="#fffbeb" stroke="#d97706" stroke-width="6" stroke-linejoin="round"/>
  <!-- Tag Hole -->
  <circle cx="50" cy="46" r="5" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <!-- Percent Symbol Detail on Tag -->
  <line x1="78" y1="52" x2="62" y2="68" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
  <circle cx="62" cy="52" r="4" fill="none" stroke="#b45309" stroke-width="3"/>
  <circle cx="78" cy="68" r="4" fill="none" stroke="#b45309" stroke-width="3"/>
</svg>
