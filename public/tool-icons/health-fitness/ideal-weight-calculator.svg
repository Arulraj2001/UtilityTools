<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Ideal Weight Calculator</title>
  <rect width="128" height="128" rx="28" fill="#fff5f5"/>
  <!-- Mechanical Weight Scale -->
  <rect x="28" y="32" width="72" height="72" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="6"/>
  <!-- Dial dial window -->
  <path d="M44 56 A20 20 0 0 1 84 56 Z" fill="#ffffff" stroke="#ef4444" stroke-width="4" stroke-linejoin="round"/>
  <!-- Pointer line -->
  <line x1="64" y1="56" x2="64" y2="44" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <!-- Scale foot treads -->
  <rect x="42" y="70" width="16" height="24" rx="4" fill="#fca5a5" stroke="#ef4444" stroke-width="3"/>
  <rect x="70" y="70" width="16" height="24" rx="4" fill="#fca5a5" stroke="#ef4444" stroke-width="3"/>
</svg>
