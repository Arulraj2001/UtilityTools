<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">BMR Calculator</title>
  <rect width="128" height="128" rx="28" fill="#fff5f5"/>
  <!-- Heartbeat / EKG line -->
  <path d="M26 64 H44 L52 38 L62 88 L70 54 L76 70 H102" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glowing pulse node -->
  <circle cx="52" cy="38" r="6" fill="#dc2626"/>
  <!-- Small Gear at bottom right representing metabolic engine -->
  <circle cx="86" cy="86" r="10" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
  <path d="M86 72 V76 M86 96 V100 M72 86 H76 M96 86 H100" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
</svg>
