<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Line Sorter</title>
  <rect width="128" height="128" rx="28" fill="#faf5ff"/>
  <!-- Document Page -->
  <rect x="34" y="28" width="56" height="72" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="6"/>
  <!-- List lines of text -->
  <line x1="44" y1="44" x2="70" y2="44" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="44" y1="56" x2="66" y2="56" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="44" y1="68" x2="74" y2="68" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="44" y1="80" x2="60" y2="80" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Sorting arrow on page -->
  <path d="M78 44 V74" fill="none" stroke="#6b21a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M74 70 l4 4 l4-4" fill="none" stroke="#6b21a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A-Z Alphabetical Badge (Bottom Right) -->
  <circle cx="86" cy="84" r="18" fill="#faf5ff" stroke="#6b21a8" stroke-width="4.5"/>
  <text x="86" y="88" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#6b21a8" text-anchor="middle">A-Z</text>
</svg>
