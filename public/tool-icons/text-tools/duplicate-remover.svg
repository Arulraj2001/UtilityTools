  <rect width="128" height="128" rx="28" fill="#faf5ff"/>
  <!-- Back Page (with duplicates) -->
  <rect x="30" y="24" width="48" height="64" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="5"/>
  <line x1="38" y1="38" x2="68" y2="38" stroke="#9333ea" stroke-width="3"/>
  <line x1="38" y1="48" x2="68" y2="48" stroke="#9333ea" stroke-width="3"/>
  <line x1="38" y1="58" x2="68" y2="58" stroke="#9333ea" stroke-width="3"/>
  <!-- Front Page (cleaned) -->
  <rect x="48" y="40" width="48" height="64" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="5"/>
  <line x1="56" y1="54" x2="86" y2="54" stroke="#9333ea" stroke-width="3"/>
  <line x1="56" y1="64" x2="80" y2="64" stroke="#9333ea" stroke-width="3"/>
  <line x1="56" y1="74" x2="86" y2="74" stroke="#9333ea" stroke-width="3"/>
  <!-- Cleaning / Sparkle check badge -->
