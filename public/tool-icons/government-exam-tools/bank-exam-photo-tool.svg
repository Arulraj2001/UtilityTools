<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Bank Exam Photo Tool</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Bank Building -->
  <path d="M34 82 V58 H94 V82 Z" fill="#ccfbf1" stroke="#0d9488" stroke-width="5" stroke-linejoin="round"/>
  <path d="M30 58 L64 42 L98 58 Z" fill="#ccfbf1" stroke="#0d9488" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pillars -->
  <line x1="46" y1="58" x2="46" y2="82" stroke="#0d9488" stroke-width="4"/>
  <line x1="64" y1="58" x2="64" y2="82" stroke="#0d9488" stroke-width="4"/>
  <line x1="82" y1="58" x2="82" y2="82" stroke="#0d9488" stroke-width="4"/>
  <!-- Base line -->
  <line x1="28" y1="82" x2="100" y2="82" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
  <!-- Resizing bracket corners -->
  <path d="M26 38 H38 M26 38 V50 M102 38 H90 M102 38 V50 M26 90 H38 M26 90 V78 M102 90 H90 M102 90 V78" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
