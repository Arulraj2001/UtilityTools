<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">PDF Page Extractor</title>
  <rect width="128" height="128" rx="28" fill="#eff6ff"/>
  <!-- Back page stack -->
  <rect x="28" y="38" width="54" height="64" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
  <!-- Front page being extracted -->
  <rect x="46" y="26" width="54" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="6"/>
  <!-- Arrow pointing out/up-right -->
  <path d="M72 46 l16-16 M88 30 h-10 M88 30 v10" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text lines on page -->
  <line x1="58" y1="44" x2="74" y2="44" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="58" x2="88" y2="58" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="72" x2="88" y2="72" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
</svg>
