<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">COD Risk &amp; Fee Analyzer</title>
  <rect width="128" height="128" rx="28" fill="#f5f3ff"/>
  <!-- Cash Stack -->
  <g transform="translate(28, 56) rotate(-12)">
    <rect x="0" y="0" width="52" height="28" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="5"/>
    <circle cx="26" cy="14" r="6" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  </g>
  <g transform="translate(36, 52) rotate(6)">
    <rect x="0" y="0" width="52" height="28" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="5"/>
    <circle cx="26" cy="14" r="6" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <path d="M23 11 h6 M23 14 h6 M25 11 v5" fill="none" stroke="#3730a3" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Delivery Package -->
  <rect x="68" y="32" width="34" height="32" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="5"/>
  <path d="M85 32 V64 M68 48 H102" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <!-- Protective Risk Warning Shield -->
  <path d="M82 72 L96 62 L110 72 V84 Q96 96 82 84 Z" fill="#f5f3ff" stroke="#ea580c" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Exclamation mark in shield -->
  <line x1="96" y1="69" x2="96" y2="78" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="96" cy="83" r="1.5" fill="#ea580c"/>
</svg>
