<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Advanced Shipping Label Studio</title>
  <rect width="128" height="128" rx="28" fill="#f5f3ff"/>
  <!-- Shipping Label -->
  <rect x="36" y="24" width="56" height="80" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="6"/>
  <!-- Top Banner -->
  <rect x="42" y="30" width="44" height="12" fill="#e0e7ff"/>
  <line x1="48" y1="36" x2="80" y2="36" stroke="#3730a3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Address lines -->
  <line x1="46" y1="52" x2="82" y2="52" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="60" x2="72" y2="60" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="68" x2="80" y2="68" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Barcode -->
  <g transform="translate(44, 76)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#3730a3" stroke-width="3"/>
    <line x1="6" y1="0" x2="6" y2="16" stroke="#3730a3" stroke-width="1.5"/>
    <line x1="11" y1="0" x2="11" y2="16" stroke="#3730a3" stroke-width="4.5"/>
    <line x1="17" y1="0" x2="17" y2="16" stroke="#3730a3" stroke-width="1.5"/>
    <line x1="22" y1="0" x2="22" y2="16" stroke="#3730a3" stroke-width="3"/>
    <line x1="28" y1="0" x2="28" y2="16" stroke="#3730a3" stroke-width="1.5"/>
    <line x1="33" y1="0" x2="33" y2="16" stroke="#3730a3" stroke-width="4.5"/>
    <line x1="39" y1="0" x2="39" y2="16" stroke="#3730a3" stroke-width="2"/>
  </g>
  <!-- Studio Star Badge (Bottom Right) -->
  <circle cx="86" cy="84" r="18" fill="#f5f3ff" stroke="#ea580c" stroke-width="4.5"/>
  <path d="M86 74 L89 80 L96 81 L91 86 L92 92 L86 89 L80 92 L81 86 L76 81 L83 80 Z" fill="#ea580c"/>
</svg>
