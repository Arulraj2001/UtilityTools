<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Delivery Time Estimator</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Speed Lines -->
  <path d="M20 46 H30 M16 56 H28 M18 66 H30" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <!-- Cardboard Box -->
  <rect x="38" y="38" width="56" height="48" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="6"/>
  <path d="M38 52 H94 M66 38 V52" fill="none" stroke="#0f766e" stroke-width="4"/>
  <!-- Clock Overlay -->
  <circle cx="86" cy="82" r="20" fill="#f0fdfa" stroke="#ea580c" stroke-width="5"/>
  <!-- Clock Hands -->
  <path d="M86 70 V82 H94" fill="none" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock ticks -->
  <circle cx="86" cy="67" r="1.5" fill="#ea580c"/>
  <circle cx="101" cy="82" r="1.5" fill="#ea580c"/>
</svg>
