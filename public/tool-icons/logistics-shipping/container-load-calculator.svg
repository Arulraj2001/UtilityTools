<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Container Load Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Shipping Container Frame (Open front) -->
  <rect x="28" y="34" width="72" height="60" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="6"/>
  <!-- Corrugated side wall lines (left/right frame edges) -->
  <path d="M28 34 h-4 v60 h4" fill="none" stroke="#0f766e" stroke-width="4"/>
  <path d="M100 34 h4 v60 h-4" fill="none" stroke="#0f766e" stroke-width="4"/>
  <!-- Stacked Cargo Packages inside -->
  <!-- Row 1 (Bottom) -->
  <rect x="34" y="64" width="20" height="24" rx="2" fill="#ccfbf1" stroke="#115e59" stroke-width="3.5"/>
  <line x1="34" y1="76" x2="54" y2="76" stroke="#115e59" stroke-width="2"/>
  <rect x="54" y="64" width="20" height="24" rx="2" fill="#ccfbf1" stroke="#115e59" stroke-width="3.5"/>
  <line x1="54" y1="76" x2="74" y2="76" stroke="#115e59" stroke-width="2"/>
  <rect x="74" y="64" width="20" height="24" rx="2" fill="#ccfbf1" stroke="#115e59" stroke-width="3.5"/>
  <line x1="74" y1="76" x2="94" y2="76" stroke="#115e59" stroke-width="2"/>
  <!-- Row 2 (Top) -->
  <rect x="44" y="44" width="20" height="20" rx="2" fill="#ccfbf1" stroke="#115e59" stroke-width="3.5"/>
  <line x1="44" y1="54" x2="64" y2="54" stroke="#115e59" stroke-width="2"/>
  <rect x="64" y="44" width="20" height="20" rx="2" fill="#ccfbf1" stroke="#115e59" stroke-width="3.5"/>
  <line x1="64" y1="54" x2="84" y2="54" stroke="#115e59" stroke-width="2"/>
</svg>
