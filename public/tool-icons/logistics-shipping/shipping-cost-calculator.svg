  <!-- Wheels -->
  <circle cx="44" cy="86" r="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="5"/>
  <circle cx="44" cy="86" r="4" fill="#0f766e"/>
  <circle cx="84" cy="86" r="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="5"/>
  <circle cx="84" cy="86" r="4" fill="#0f766e"/>
  <!-- Rupee Symbol on Cargo Box -->
  <path d="M46 51 h12 M46 56 h12 M49 51 v10 c0 2 2 3 5 3 M50 64 l 6 6" fill="none" stroke="#115e59" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
