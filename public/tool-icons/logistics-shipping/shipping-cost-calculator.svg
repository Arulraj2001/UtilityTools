<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Shipping Cost Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Delivery Truck -->
  <!-- Cargo Area -->
  <rect x="26" y="38" width="52" height="42" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="6"/>
  <!-- Cabin -->
  <path d="M78 48 H92 L102 62 V80 H78 Z" fill="#f0fdfa" stroke="#0f766e" stroke-width="6" stroke-linejoin="round"/>
  <!-- Cabin Window -->
