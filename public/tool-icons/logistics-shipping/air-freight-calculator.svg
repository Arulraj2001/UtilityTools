<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Air Freight Calculator</title>
  <rect width="128" height="128" rx="28" fill="#f0fdfa"/>
  <!-- Cargo Plane Details -->
  <g transform="translate(10, 8)">
    <!-- Back wing/stabilizer -->
    <path d="M60 48 L44 20 H54 L72 48 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="5" stroke-linejoin="round"/>
    <!-- Tail Fin -->
    <path d="M36 48 L22 28 H30 L46 48 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="5" stroke-linejoin="round"/>
    <!-- Main Body/Fuselage -->
    <path d="M24 48 C 24 43, 88 34, 98 40 C 104 46, 98 56, 90 56 C 82 56, 24 53, 24 48 Z" fill="#f0fdfa" stroke="#0f766e" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- Front wing -->
    <path d="M66 48 L48 80 H60 L80 48 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- Cargo Package hanging below -->
  <rect x="50" y="78" width="28" height="24" rx="3" fill="#ccfbf1" stroke="#115e59" stroke-width="4"/>
  <path d="M50 90 H78 M64 78 V102" fill="none" stroke="#115e59" stroke-width="3"/>
</svg>
